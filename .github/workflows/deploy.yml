name: Deploy to Home Server

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-home-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Reload (Home Server)
    runs-on: [self-hosted, home-server]
    steps:
      - name: Deploy to GoodLife Web app directory
        env:
          ACTIONS_RUNNER_HOOK_JOB_COMPLETED: ""
          RUNNER_TRACKING_ID: ""
        run: |
          set -e
          export ACTIONS_RUNNER_HOOK_JOB_COMPLETED=""
          export RUNNER_TRACKING_ID=""
          cd /home/khesh/apps/goodlife-event-tickets

          echo "==> Fetching latest changes from master..."
          git fetch origin master
          git reset --hard origin/master

          echo "==> Installing any new dependencies..."
          npm install --prefer-offline --no-audit

          echo "==> Building Next.js app..."
          npm run build

          echo "==> Clearing port 3000 and restarting PM2 goodlife-web..."
          # Stop pm2 process first
          pm2 stop goodlife-web || true
          # Kill any lingering node process holding port 3000
          fuser -k 3000/tcp 2>/dev/null || true
          sleep 2
          # Restart cleanly
          pm2 restart goodlife-web --update-env || pm2 start npm --name "goodlife-web" -- run start -- -p 3000

          echo "==> PM2 Error Log (last 20 lines):"
          tail -n 20 /home/khesh/.pm2/logs/goodlife-web-error.log || true

          echo "==> PM2 Output Log (last 20 lines):"
          tail -n 20 /home/khesh/.pm2/logs/goodlife-web-out.log || true

          echo "==> PM2 Describe goodlife-web:"
          pm2 describe goodlife-web
