<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | GOODLIFE</title>
  <style>
    :root {
      --bg: #F3ECE1;
      --navy: #142B4C;
      --orange: #FF6B35;
      --text-muted: #556270;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--navy);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 3px solid var(--navy);
      box-shadow: 6px 6px 0px 0px var(--navy);
      border-radius: 16px;
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      background: #FFE8E0;
      color: var(--orange);
      border: 2px solid var(--orange);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
      line-height: 1;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--navy);
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--navy);
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 20px;
      border: 2px solid var(--navy);
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 3px 3px 0px 0px var(--orange);
      text-decoration: none;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .button:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px 0px var(--orange);
    }
    .button:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px 0px var(--orange);
    }
    .status-note {
      margin-top: 18px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Connection Offline</div>
    <div class="icon">📡</div>
    <h1>You are currently offline</h1>
    <p>
      It looks like your internet connection is down or intermittent. Your cached tickets and saved draft orders remain safe on your device.
    </p>
    <button class="button" onclick="window.location.reload()">
      Retry Connection
    </button>
    <div class="status-note">
      When connection returns, GoodLife will automatically re-sync.
    </div>
  </div>
</body>
</html>
